<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>rust-wasm benchmark</title>
</head>
<body>
<pre id="output">Executando benchmarks...</pre>
<script type="module">

import init, { fibonacci } from './rust_wasm.js';

function measure(fn, warmup, runs) {
    // JIT warmup
    for (let i = 0; i < warmup; i++) {
        fn();
    }

    const start = performance.now();

    for (let i = 0; i < runs; i++) {
        fn();
    }

    const totalMs = performance.now() - start;

    return Number((totalMs / runs).toFixed(3));
}

async function main() {
    await init();

    const params = new URLSearchParams(window.location.search);
    const algorithm = params.get('algorithm');
    const iterations = Number(params.get('iterations'))
    const wasmJit = Number(params.get('wasmJit'));

    let result = {};
    switch (algorithm) {
        case 'fibonacci':
            result = {
                mean_ms: measure(() => fibonacci(40n), wasmJit, iterations)
            };
            break;
        default:
            throw new Error(`Algoritmo não encontrado: ${algorithm}`);
    }

    window.__benchmarkResult = result;
    document.getElementById('output').textContent = JSON.stringify(result, null, 2);
}

main().catch((error) => {
    window.__benchmarkError = error.message;
    document.getElementById('output').textContent = 'Erro: ' + error.message;
});
</script>
</body>
</html>
