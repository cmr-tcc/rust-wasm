<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>rust-wasm benchmark</title>
</head>
<body>
<script type="module">

import init, { fibonacci, double, nsieve, fannkuch_redux, n_body, spectral_norm, mandelbrot, fasta } from './rust_wasm.js';

function measure(fn, warmup, runs) {
    window.__benchmarkOutput = '';

    // JIT warmup
    for (let i = 0; i < warmup; i++) {
        const output = fn();
        window.__benchmarkOutput += `Output: ${output}\n`;
    }

    const start = performance.now();

    for (let i = 0; i < runs; i++) {
        const output = fn();
        window.__benchmarkOutput += `Output: ${output}\n`;
    }

    const totalMs = performance.now() - start;

    return Number((totalMs / runs).toFixed(3));
}

async function main() {
    await init();

    const params = new URLSearchParams(window.location.search);
    const algorithm = params.get('algorithm');
    const iterations = Number(params.get('iterations'))
    const wasmJit = Number(params.get('wasmJit'));
    const parameter = BigInt(params.get('parameter'));

    let result = {};
    switch (algorithm) {
        case 'fibonacci':
            result = {
                mean_ms: measure(() => fibonacci(parameter), wasmJit, iterations)
            };
            break;
        case 'double':
            result = {
                mean_ms: measure(() => double(parameter), wasmJit, iterations)
            };
            break;
        case 'nsieve':
            result = {
                mean_ms: measure(() => nsieve(parameter), wasmJit, iterations)
            };
            break;
        case 'fannkuch_redux':
            result = {
                mean_ms: measure(() => fannkuch_redux(parameter), wasmJit, iterations)
            }
            break;
        case 'n_body':
            result = {
                mean_ms: measure(() => n_body(parameter), wasmJit, iterations)
            }
            break;
        case 'spectral_norm':
            result = {
                mean_ms: measure(() => spectral_norm(parameter), wasmJit, iterations)
            }
            break;
        case 'mandelbrot':
            result = {
                mean_ms: measure(() => mandelbrot(parameter), wasmJit, iterations)
            }
            break;
        case 'fasta':
            result = {
                mean_ms: measure(() => fasta(parameter), wasmJit, iterations)
            }
            break;
        default:
            throw new Error(`Algoritmo não encontrado: ${algorithm}`);
    }

    window.__benchmarkResult = result;
}

main().catch((error) => {
    window.__benchmarkError = error.message;
});
</script>
</body>
</html>
