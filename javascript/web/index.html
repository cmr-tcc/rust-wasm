<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>rust-wasm benchmark</title>
</head>
<body>
<script type="module">

import init, { fibonacci, fannkuch_redux, n_body, spectral_norm, mandelbrot, fasta } from './rust_wasm.js';

function measure(fn, warmup, runs) {
    window.__benchmarkOutput = '';

    // JIT warmup
    for (let i = 0; i < warmup; i++) {
        const output = fn();
        window.__benchmarkOutput += `Output: ${output}\n`;
    }

    const times = [];
    for (let i = 0; i < runs; i++) {
        const start = performance.now();
        const output = fn();
        const totalMs = performance.now() - start;
        times.push(totalMs);
        window.__benchmarkOutput += `Output: ${output}\n`;
    }

    return times;
}

async function main() {
    await init();

    const params = new URLSearchParams(window.location.search);
    const algorithm = params.get('algorithm');
    const iterations = Number(params.get('iterations'))
    const warmUp = Number(params.get('warm_up'));
    const parameter = BigInt(params.get('parameter'));

    let result = {};

    await new Promise(resolve => setTimeout(resolve, 10_000)); // 10 seconds in idle to measure resource usage in stand-by

    switch (algorithm) {
        case 'fibonacci':
            result = {
                times: measure(() => fibonacci(parameter), warmUp, iterations)
            };
            break;
        case 'fannkuch_redux':
            result = {
                times: measure(() => fannkuch_redux(parameter), warmUp, iterations)
            }
            break;
        case 'n_body':
            result = {
                times: measure(() => n_body(parameter), warmUp, iterations)
            }
            break;
        case 'spectral_norm':
            result = {
                times: measure(() => spectral_norm(parameter), warmUp, iterations)
            }
            break;
        case 'mandelbrot':
            result = {
                times: measure(() => mandelbrot(parameter), warmUp, iterations)
            }
            break;
        case 'fasta':
            result = {
                times: measure(() => fasta(parameter), warmUp, iterations)
            }
            break;
        default:
            throw new Error(`Algoritmo não encontrado: ${algorithm}`);
    }

    await new Promise(resolve => setTimeout(resolve, 10_000)); // 10 seconds in idle to measure resource usage in stand-by

    window.__benchmarkResult = result;
}

main().catch((error) => {
    window.__benchmarkError = error.message;
});
</script>
</body>
</html>
