<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>rust-wasm benchmark</title>
</head>
<body>
<pre id="output">Executando benchmarks...</pre>
<script type="module">

import init, { fibonacci } from './rust_wasm.js';

function measure(fn, warmup, runs) {
    // JIT warmup
    for (let i = 0; i < warmup; i++) {
        fn();
    }

    const start = performance.now();

    for (let i = 0; i < runs; i++) {
        fn();
    }

    const totalMs = performance.now() - start;

    return totalMs / runs;
}

async function main() {
    await init();

    const results = [
        { 
            algorithm: 'fibonacci', 
            input: 40, 
            mean_ms: measure(() => fibonacci(40n), 30, 200) 
        },
    ];

    window.__benchmarkResults = results;
    document.getElementById('output').textContent = JSON.stringify(results, null, 2);
}

main().catch((error) => {
    window.__benchmarkError = error.message;
    document.getElementById('output').textContent = 'Erro: ' + error.message;
});
</script>
</body>
</html>
